services:
  # PostgreSQL Database with pgvector extension
  db:
    image: ankane/pgvector:latest
    container_name: hq-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hq_development_password_2026
      POSTGRES_DB: hq_development_db
    volumes:
      - hq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for NestJS caching and BullMQ background task processing
  redis:
    image: redis:7-alpine
    container_name: hq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - hq_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  hq_postgres_data:
  hq_redis_data:
